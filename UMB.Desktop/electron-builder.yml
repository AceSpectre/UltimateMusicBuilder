appId: com.umb.desktop
productName: UltimateMusicBuilder
directories:
  output: out
  buildResources: static
files:
  - dist/**/*
extraResources:
  - from: ../publish/
    to: cli/
    filter:
      - "**/*"
      - "!**/*.pdb"
win:
  target:
    - nsis
    - zip
  icon: static/icons/icon.ico
mac:
  icon: static/icons/icon.png
linux:
  icon: static/icons/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
