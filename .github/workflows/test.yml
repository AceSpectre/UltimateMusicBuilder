name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UMB.Desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UMB.Desktop/package-lock.json

      - run: npm ci
      - run: npm run test

  e2e:
    name: Playwright E2E
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: UMB.Desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UMB.Desktop/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx playwright test
