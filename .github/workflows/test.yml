name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UMB.Desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UMB.Desktop/package-lock.json

      - run: npm ci
      - run: npm run test

  e2e:
    name: Playwright E2E
    # Heavy specs (build-differential, playlist-info, config-volume LUFS, nus3-convert)
    # auto-skip here: they need un-committed game resources + ffmpeg/pymusiclooper that
    # aren't on the runner. The portable subset (order/merge/extract-icons/boot/locale)
    # runs for real. Full suite runs locally on Windows with resources + tools present.
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: UMB.Desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UMB.Desktop/package-lock.json

      - run: npm ci
      # test:e2e builds first via the pretest hook, so the suite can never run
      # against a stale dist/. A globalSetup staleness check backs this up.
      - run: npm run test:e2e
